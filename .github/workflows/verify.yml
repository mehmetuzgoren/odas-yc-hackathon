name: Verify ODAS
on:
  pull_request:
    branches: [dev]
  push:
    branches: [dev]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.12.19
      - run: bun install --frozen-lockfile
      - run: uv sync --frozen --project workers/device --python 3.13.7
      - run: bun run check
      - name: Native actor restart and commerce integration
        run: bun run test:integration
      - name: Real Relay and simulated turnover recovery
        run: bun run test:scenario
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: odas-verification
          path: |
            .data/test-integration-*/result.json
            .data/test-scenario-*/evidence.json
          if-no-files-found: ignore
